<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RΞD · Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    /* ———— RESET ———— */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0002;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    }

    /* ———— AMBIENT NEON RED ORBS ———— */
    .glow-sphere {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .gs-1 {
      width: 550px;
      height: 550px;
      background: #ff003c;
      top: -280px;
      right: -180px;
      opacity: 0.12;
      animation: orbFloat 18s ease-in-out infinite alternate;
    }
    .gs-2 {
      width: 450px;
      height: 450px;
      background: #cc0033;
      bottom: -200px;
      left: -120px;
      opacity: 0.10;
      animation: orbFloat 22s ease-in-out infinite alternate-reverse;
    }
    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(70px, -50px) scale(1.4); }
    }

    /* ———— BREATHING RED BORDER ———— */
    .card {
      position: relative;
      z-index: 10;
      max-width: 420px;
      width: 100%;
      background: rgba(10, 0, 2, 0.65);
      backdrop-filter: blur(36px) saturate(1.4);
      -webkit-backdrop-filter: blur(36px) saturate(1.4);
      border-radius: 56px;
      padding: 44px 28px 36px;
      border: 1px solid rgba(255, 0, 60, 0.15);
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 0, 60, 0.05) inset;
      text-align: center;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 1.5s ease;
      animation: borderPulse 3s infinite alternate;
    }
    @keyframes borderPulse {
      0% { border-color: rgba(255, 0, 60, 0.12); }
      100% { border-color: rgba(255, 0, 60, 0.35); }
    }
    .card:hover {
      transform: scale(1.008);
    }

    /* ———— TOP BADGE (TERMINAL STYLE) ———— */
    .badge-ios {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 0, 60, 0.06);
      backdrop-filter: blur(10px);
      padding: 5px 18px 5px 12px;
      border-radius: 40px;
      border: 1px solid rgba(255, 0, 60, 0.10);
      margin-bottom: 24px;
    }
    .badge-ios .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff003c;
      box-shadow: 0 0 16px #ff003c;
      animation: pulseDot 1.2s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.7); }
    }
    .badge-ios span {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .badge-ios .count {
      color: #ff4d6d;
      font-weight: 700;
      background: rgba(255, 0, 60, 0.08);
      padding: 0 12px;
      border-radius: 20px;
    }

    /* ———— HEADLINE ———— */
    h1 {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: #ffffff;
      margin-bottom: 4px;
    }
    h1 .gradient-text {
      background: linear-gradient(135deg, #ff4d6d 0%, #cc0033 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 40px rgba(255, 0, 60, 0.2);
    }
    .subhead {
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.9rem;
      font-weight: 400;
      margin-bottom: 32px;
      letter-spacing: 0.04em;
    }

    /* ———— TIMER + PROGRESS (NEON RED) ———— */
    .timer-area {
      margin-bottom: 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timer-digits {
      font-size: 3.8rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
      letter-spacing: 0.02em;
      transition: color 0.4s ease;
      line-height: 1;
      margin-bottom: 12px;
      text-shadow: 0 0 30px rgba(255, 0, 60, 0.1);
    }
    .timer-digits.warning { color: #ff4d6d; }
    .timer-digits.urgent { color: #ff003c; animation: textPulse 0.7s infinite; }
    @keyframes textPulse {
      0%, 100% { opacity: 1; text-shadow: 0 0 40px #ff003c; }
      50% { opacity: 0.2; text-shadow: 0 0 0px #ff003c; }
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff003c, #ff4d6d);
      border-radius: 10px;
      transition: width 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: 0 0 30px rgba(255, 0, 60, 0.4);
    }

    /* ———— LIVE JOIN TICKER (RED THEME) ———— */
    .ticker-container {
      width: 100%;
      height: 28px;
      overflow: hidden;
      margin-bottom: 28px;
      background: rgba(255, 0, 60, 0.03);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 1px solid rgba(255, 0, 60, 0.05);
    }
    .ticker-scroll {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: scrollTicker 12s linear infinite;
    }
    .ticker-item {
      height: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.35);
      font-size: 0.75rem;
      font-weight: 400;
      white-space: nowrap;
      padding: 0 12px;
    }
    .ticker-item strong {
      color: #ff4d6d;
      font-weight: 600;
    }
    .ticker-item .time-ago {
      color: #ff003c;
      font-size: 0.65rem;
      font-weight: 600;
    }

    @keyframes scrollTicker {
      0% { transform: translateY(0); }
      100% { transform: translateY(-100%); }
    }

    /* ———— THE BUTTON (MAGNETIC RED) ———— */
    .join-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      padding: 18px 24px;
      background: #ff003c;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 40px rgba(255, 0, 60, 0.3);
      position: relative;
      overflow: hidden;
      letter-spacing: 0.01em;
    }
    .join-btn::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 42px;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .join-btn:hover::after {
      opacity: 1;
    }
    .join-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 56px rgba(255, 0, 60, 0.5);
      background: #ff1a4a;
    }
    .join-btn:active {
      transform: scale(0.96);
    }
    .join-btn .icon-arrow {
      transition: transform 0.3s ease;
      font-size: 1.3rem;
    }
    .join-btn:hover .icon-arrow {
      transform: translateX(6px) rotate(-10deg);
    }

    /* pulsating glow ring behind button */
    .btn-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      background: #ff003c;
      filter: blur(40px);
      opacity: 0.10;
      z-index: -1;
      animation: glowPulse 2s infinite;
    }
    @keyframes glowPulse {
      0%, 100% { transform: scale(1); opacity: 0.10; }
      50% { transform: scale(1.06); opacity: 0.25; }
    }

    /* ———— FOOTER META (NO 12K MEMBERS) ———— */
    .footer-meta {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 0, 60, 0.06);
    }
    .footer-meta span {
      color: rgba(255, 255, 255, 0.15);
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .footer-meta .num {
      color: rgba(255, 255, 255, 0.3);
      font-weight: 700;
    }
    /* removed the member count line entirely */

    /* ———— RESPONSIVE ———— */
    @media (max-width: 440px) {
      .card { padding: 32px 18px 28px; border-radius: 40px; }
      h1 { font-size: 2.2rem; }
      .timer-digits { font-size: 3rem; }
      .join-btn { font-size: 1rem; padding: 16px 20px; }
    }
  </style>
</head>
<body>

  <!-- GLOW ORBS (RED) -->
  <div class="glow-sphere gs-1"></div>
  <div class="glow-sphere gs-2"></div>

  <!-- CARD -->
  <div class="card">

    <!-- BADGE -->
    <div class="badge-ios">
      <span class="live-dot"></span>
      <span>Live</span>
      <span class="count" id="liveCount">89</span>
      <span>joined</span>
    </div>

    <!-- HEADLINE -->
    <h1><span class="gradient-text">RΞD</span> Access</h1>
    <p class="subhead">Invite‑only · 24h window</p>

    <!-- TIMER + PROGRESS -->
    <div class="timer-area">
      <div class="timer-digits" id="timerDisplay">10:00</div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- LIVE TICKER (FOMO) -->
    <div class="ticker-container">
      <div class="ticker-scroll" id="tickerScroll">
        <!-- injected by JS -->
      </div>
    </div>

    <!-- BUTTON WITH GLOW (YOUR LINK) -->
    <div style="position: relative; z-index: 1;">
      <div class="btn-glow"></div>
      <a href="https://t.me/+fB39naJwgfEzOWU1"
         class="join-btn"
         id="joinBtn"
         target="_blank"
         rel="noopener noreferrer">
        <span>Enter Telegram</span>
        <span class="icon-arrow">⟶</span>
      </a>
    </div>

    <!-- FOOTER META (CLEAN, NO 12K) -->
    <div class="footer-meta">
      <span>🔒 <span class="num">256</span>‑bit</span>
      <span>⚡ <span class="num">0%</span>‑latency</span>
      <span>📱 Android & iOS ready</span>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ——— CONFIG ———
      const TELEGRAM_URL = 'https://t.me/+fB39naJwgfEzOWU1'; // YOUR EXACT LINK
      const INITIAL_SECONDS = 600; // 10 min
      const STORAGE_KEY = 'red_timer';

      // ——— DOM ———
      const timerDisplay = document.getElementById('timerDisplay');
      const progressFill = document.getElementById('progressFill');
      const joinBtn = document.getElementById('joinBtn');
      const liveCountEl = document.getElementById('liveCount');

      // ——— STATE ———
      let remaining = INITIAL_SECONDS;
      let timerInterval = null;
      let isExpired = false;

      // ——— FAKE USERNAMES (CYBER/RED THEME) ———
      const fakeNames = [
        '0x_red', 'crimson_byte', 'neon_ghost', 'shadow_ops', 'volt_agent',
        'inferno_core', 'cyber_pulse', 'red_queen', 'delta_fire', 'omega_rx',
        'phoenix_zk', 'rage_frame', 'synth_wave', 'void_runner', 'blaze_hash'
      ];
      const tickerScroll = document.getElementById('tickerScroll');

      // ——— TIMER HELPERS ———
      function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      function updateUI() {
        timerDisplay.textContent = formatTime(remaining);
        timerDisplay.classList.remove('warning', 'urgent');
        if (remaining <= 60) timerDisplay.classList.add('urgent');
        else if (remaining <= 180) timerDisplay.classList.add('warning');

        const elapsed = INITIAL_SECONDS - remaining;
        const pct = Math.min(100, (elapsed / INITIAL_SECONDS) * 100);
        progressFill.style.width = pct + '%';

        if (remaining <= 0 && !isExpired) handleExpiry();
      }

      function handleExpiry() {
        if (isExpired) return;
        isExpired = true;
        clearInterval(timerInterval);
        timerInterval = null;
        timerDisplay.textContent = '00:00';
        timerDisplay.classList.add('urgent');
        joinBtn.classList.add('disabled');
        joinBtn.innerHTML = `<span>⌛ Session Expired</span><span class="icon-arrow">✕</span>`;
        joinBtn.href = '#';
        joinBtn.style.opacity = '0.4';
        joinBtn.style.pointerEvents = 'none';
        try { localStorage.removeItem(STORAGE_KEY); } catch(_) {}
      }

      function tick() {
        if (remaining <= 0) { handleExpiry(); return; }
        remaining -= 1;
        updateUI();
        if (remaining % 5 === 0) {
          try { localStorage.setItem(STORAGE_KEY, String(remaining)); } catch(_) {}
        }
      }

      function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(tick, 1000);
      }

      function loadState() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored !== null) {
            const parsed = parseInt(stored, 10);
            if (!isNaN(parsed) && parsed > 0 && parsed <= INITIAL_SECONDS) {
              remaining = parsed;
              return true;
            }
          }
        } catch(_) {}
        return false;
      }

      // ——— TICKER ———
      function buildTicker() {
        const items = [];
        for (let i = 0; i < 20; i++) {
          const name = fakeNames[Math.floor(Math.random() * fakeNames.length)];
          const mins = Math.floor(Math.random() * 12) + 1;
          const secs = Math.floor(Math.random() * 60);
          items.push({ name, time: `${mins}m ${secs}s ago` });
        }
        return items;
      }

      function renderTicker() {
        const items = buildTicker();
        let html = '';
        for (let rep = 0; rep < 2; rep++) {
          for (const item of items) {
            html += `<div class="ticker-item">
              <strong>${item.name}</strong> joined · <span class="time-ago">${item.time}</span>
            </div>`;
          }
        }
        tickerScroll.innerHTML = html;
      }

      // ———— LIVE COUNT (RANDOM SURGE) ————
      let liveCount = 89;
      function updateLiveCount() {
        liveCount += Math.floor(Math.random() * 3) + 1;
        liveCountEl.textContent = liveCount;
      }

      // ———— INIT ————
      function init() {
        const hasStored = loadState();
        if (!hasStored) {
          remaining = INITIAL_SECONDS;
          try { localStorage.setItem(STORAGE_KEY, String(remaining)); } catch(_) {}
        }
        if (remaining <= 0) {
          remaining = 0;
          updateUI();
          handleExpiry();
        } else {
          updateUI();
          startTimer();
        }

        renderTicker();
        setInterval(() => {
          renderTicker();
          tickerScroll.style.animation = 'none';
          requestAnimationFrame(() => {
            tickerScroll.style.animation = 'scrollTicker 12s linear infinite';
          });
        }, 14000);

        setInterval(updateLiveCount, 4000 + Math.random() * 4000);

        setInterval(() => {
          if (remaining <= 0 && !isExpired) handleExpiry();
        }, 2000);
      }

      init();
    })();
  </script>
</body>
</html>
